server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/keepintouch
    username: "postgres"
    password: "passer123"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/contacts.readonly
              - https://www.googleapis.com/auth/gmail.readonly

logging:
  level:
    com.isi.keepintouch_backend: DEBUG

app:
  jwt:
    secret: cUnSecretTresLongEtAleatoirePourLeProjetKeepInTouchISI2026MinimumBits
    expiration-ms: 86400000   # 24 heures